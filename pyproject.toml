[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "puzzlefind"
version = "0.1.0"
description = "在几百块摊开的拼图碎片里，按背面编号找到指定的那一块"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
# paddlepaddle 本体**故意不在这里**，必须单独装（见 README）。
# 两个原因：
# 1. 本项目要的是 GPU 版 `paddlepaddle-gpu`，它只在 Paddle 自己的源上，
#    装它必须带 `-i` 换源，这在依赖列表里表达不了。
# 2. `paddlepaddle`（CPU）和 `paddlepaddle-gpu` 是两个发行名却抢同一个
#    `paddle` 包目录。把 CPU 版写进这里的后果实测过：GPU 版装好之后再跑
#    一次 `pip install -e .`，pip 会不声不响地把 CPU 版装回来，**34 倍的
#    提速就这么没了，而且全程不报错**。
# paddleocr 只依赖 paddlex、不依赖 paddlepaddle，所以这样拆是安全的：
# 装漏了会当场 ImportError，响亮的失败好过安静的退化。
dependencies = [
    "opencv-python-headless>=5.0",
    "numpy>=2.0",
    "paddleocr>=3.0",
    "fastapi>=0.141",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]  # httpx: fastapi.testclient.TestClient 依赖它

[project.scripts]
puzzlefind = "puzzlefind.cli:main"

[tool.setuptools]
packages = ["puzzlefind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ocr: 需要加载 PaddleOCR 的慢速测试"]
addopts = "-q"
