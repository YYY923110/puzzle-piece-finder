<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>拼图碎片查找器</title>
<style>
/* ─────────────────────────────────────────────────────────────
   配色直接取自引擎，不是另起炉灶：
   洋红 = config.OUTLINE_COLOR（命中碎片的描边）
   青色 = config.UNKNOWN_OUTLINE_COLOR（未识别碎片的描边）
   米白 = 碎片背面的实际颜色（合成图里是 235,233,228）
   界面若用别的强调色，就会和服务端渲染出来的高亮图打架。
   ───────────────────────────────────────────────────────────── */
:root {
  --table:      #12100e;   /* 桌面：偏暖的近黑，不是蓝黑 */
  --felt:       #1b1815;
  --ridge:      #2a2621;
  --chipboard:  #e3ddd1;   /* 碎片背面 */
  --graphite:   #8f887c;   /* 碎片上印刷体的灰 */
  --muted:      #6a645b;
  --target:     #ff2bd1;   /* 对齐 OUTLINE_COLOR */
  --unknown:    #35e0e0;   /* 对齐 UNKNOWN_OUTLINE_COLOR */

  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono",
          Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;

  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--table);
  color: var(--chipboard);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.55;
  overflow: hidden;
}

/* ── 布局：左侧仪表栏 + 右侧取景器 ───────────────────────────── */
.app {
  display: grid;
  grid-template-columns: 340px 1fr;
  height: 100dvh;
}

.rail {
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 22px 20px;
  background: var(--felt);
  border-right: 1px solid var(--ridge);
  overflow-y: auto;
}

/* ── 标题 ───────────────────────────────────────────────────── */
.brand-name {
  margin: 0;
  font-size: 15px;
  font-weight: 620;
  letter-spacing: .02em;
}
.brand-note {
  margin: 3px 0 0;
  font-size: 12px;
  color: var(--muted);
}

/* ── 查询区：编号输入框本身就是主角字体 ─────────────────────── */
.field-label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .14em;
  color: var(--muted);
  margin-bottom: 7px;
}

.query-row { display: flex; gap: 8px; }

#code {
  flex: 1;
  min-width: 0;
  padding: 12px 14px;
  background: var(--table);
  border: 1px solid var(--ridge);
  border-radius: 7px;
  color: var(--chipboard);
  font-family: var(--mono);
  font-size: 21px;
  font-weight: 600;
  letter-spacing: .18em;
  text-transform: uppercase;
}
#code::placeholder { color: #4a453e; letter-spacing: .18em; }
#code:focus { outline: 2px solid var(--target); outline-offset: 1px; border-color: transparent; }

.btn {
  padding: 12px 16px;
  border: 1px solid var(--ridge);
  border-radius: 7px;
  background: var(--ridge);
  color: var(--chipboard);
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s ease, border-color .15s ease;
}
.btn:hover { background: #363029; }
.btn:focus-visible { outline: 2px solid var(--target); outline-offset: 2px; }
.btn:disabled { opacity: .45; cursor: default; }

.btn-find { background: var(--target); border-color: var(--target); color: #16000f; }
.btn-find:hover { background: #ff5cdb; border-color: #ff5cdb; }

.btn-quiet { background: transparent; color: var(--graphite); font-weight: 500; }
.btn-quiet:hover { background: var(--ridge); color: var(--chipboard); }

.rail-actions { display: flex; gap: 8px; }
.rail-actions .btn { flex: 1; }

/* ── 状态行 ─────────────────────────────────────────────────── */
#status {
  font-size: 13px;
  color: var(--graphite);
  min-height: 40px;
  border-left: 2px solid var(--ridge);
  padding-left: 11px;
}
#status.is-hit  { color: var(--chipboard); border-left-color: var(--target); }
#status.is-miss { color: var(--chipboard); border-left-color: var(--unknown); }
#status.is-bad  { color: #ffb4b4;          border-left-color: #b4483f; }

/* ── 碎片卡：本设计的签名元素 ────────────────────────────────
   左右两边用 radial-gradient 遮罩铣出凹口，复刻拼图碎片的模切轮廓。
   只在这一处放胆，其余一律克制。 */
.piece-card {
  display: none;
  background: var(--chipboard);
  color: #221f1a;
  border-radius: 10px;
  padding: 14px 18px;
  --notch: 13px;
  -webkit-mask:
    radial-gradient(var(--notch) at left  50%, transparent 98%, #000 100%),
    radial-gradient(var(--notch) at right 50%, transparent 98%, #000 100%);
  -webkit-mask-composite: source-in;
  mask:
    radial-gradient(var(--notch) at left  50%, transparent 98%, #000 100%),
    radial-gradient(var(--notch) at right 50%, transparent 98%, #000 100%);
  mask-composite: intersect;
  -webkit-mask-repeat: no-repeat;
  mask-repeat: no-repeat;
}
.piece-card.is-shown { display: block; animation: card-in .22s ease-out; }

@keyframes card-in {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}

.piece-code {
  font-family: var(--mono);
  font-size: 29px;
  font-weight: 700;
  letter-spacing: .1em;
  line-height: 1.1;
  margin: 0;
}
.piece-where {
  margin: 5px 0 12px;
  font-size: 12px;
  color: #6d665c;
}
/* 缩略图底色跟照片背景一致：碎片是从深色桌面上抠下来的，
   底色若用卡片的米白，图没加载完时会闪一道白边。 */
.piece-thumb {
  display: block;
  width: 100%;
  border-radius: 5px;
  background: #14120f;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .3);
}
.piece-verify {
  margin: 9px 0 0;
  font-size: 11px;
  line-height: 1.5;
  color: #7d766b;
}

/* ── 照片列表 ───────────────────────────────────────────────── */
.photos-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
#photos { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }

.photo-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 11px;
  background: var(--table);
  border: 1px solid var(--ridge);
  border-radius: 7px;
}
.photo-id { font-family: var(--mono); font-size: 13px; }
.photo-stat { font-size: 11px; color: var(--muted); }
.photo-row .btn { padding: 5px 9px; font-size: 11px; }

.rail-empty { font-size: 12px; color: var(--muted); }

/* ── 上传前的区域选择器 ─────────────────────────────────────── */
/* 桌面区域是固定的，所以常态是「重拍已有的某一张」，不是「新建」。
   四选一比在手机上打字友好得多，而按钮上直接写「重拍替换」把语义前置，
   就不必再弹一个事后确认框。 */
#regionPicker { display: none; flex-direction: column; gap: 6px; margin-top: 10px; }
#regionPicker.is-shown { display: flex; }
.picker-title { margin: 0; font-size: 12px; color: var(--muted); }
#regionChoices { display: flex; flex-direction: column; gap: 6px; }
.picker-new { display: flex; gap: 6px; }
#regionName {
  flex: 1;
  min-width: 0;
  padding: 9px 11px;
  background: var(--table);
  border: 1px solid var(--ridge);
  border-radius: 7px;
  color: var(--chipboard);
  font-family: var(--mono);
  font-size: 13px;
}
#regionName:focus { outline: 2px solid var(--target); outline-offset: 1px; }
.picker-new .btn, #regionAdd { padding: 9px 11px; font-size: 12px; }

/* ── 未识别照片切换器 ───────────────────────────────────────── */
/* 未命中时可能有好几张照片各自都有未识别碎片。只渲染其中一张，等于把
   其余照片里的碎片藏起来——而"把搜索范围从几百块塌缩到个位数"正是
   未命中路径的全部价值，看不到就等于没有。 */
#photoSwitch { display: none; flex-direction: column; gap: 6px; }
#photoSwitch.is-shown { display: flex; }

.switch-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 11px;
  background: var(--table);
  border: 1px solid var(--ridge);
  border-radius: 7px;
  color: var(--chipboard);
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: background .12s ease, border-color .12s ease;
}
.switch-btn:hover { background: #363029; }
.switch-btn:focus-visible { outline: 2px solid var(--unknown); outline-offset: 2px; }
.switch-btn.is-active { border-color: var(--unknown); background: #363029; }
.switch-name { font-family: var(--mono); font-size: 13px; word-break: break-all; }
.switch-count { font-size: 11px; color: var(--muted); white-space: nowrap; }
.switch-btn.is-active .switch-count { color: var(--unknown); }

/* ── 取景器 ─────────────────────────────────────────────────── */
.stage { position: relative; overflow: hidden; background: #0b0a09; }

#viewport {
  position: absolute;
  inset: 0;
  overflow: hidden;
  touch-action: none;
  cursor: grab;
}
#viewport:active { cursor: grabbing; }
#view { position: absolute; transform-origin: 0 0; image-rendering: auto; }

.tools {
  position: absolute;
  right: 14px;
  bottom: 14px;
  display: flex;
  gap: 6px;
  padding: 6px;
  background: rgba(18, 16, 14, .88);
  border: 1px solid var(--ridge);
  border-radius: 9px;
  backdrop-filter: blur(6px);
}
.tools .btn { padding: 7px 11px; font-size: 12px; }

.stage-empty {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  gap: 10px;
  text-align: center;
  padding: 30px;
  pointer-events: none;
}
.stage-empty.is-gone { display: none; }
.stage-empty h2 {
  margin: 0;
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: .1em;
  color: var(--graphite);
}
.stage-empty p { margin: 0; max-width: 34ch; color: var(--muted); font-size: 13px; }

/* ── 窄屏：仪表栏收到顶部 ───────────────────────────────────── */
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .rail {
    border-right: 0;
    border-bottom: 1px solid var(--ridge);
    max-height: 58dvh;
    padding: 14px 15px;
    gap: 13px;
  }
  #code { font-size: 19px; }
}

@media (prefers-reduced-motion: reduce) {
  .piece-card.is-shown { animation: none; }
  .btn { transition: none; }
}
</style>
</head>
<body>

<div class="app">
  <aside class="rail">
    <div>
      <h1 class="brand-name">拼图碎片查找器</h1>
      <p class="brand-note">输入编号，在照片里定位那一块</p>
    </div>

    <div>
      <label class="field-label" for="code">碎片编号</label>
      <div class="query-row">
        <input id="code" type="text" placeholder="B-506" autocomplete="off"
               autocapitalize="characters" spellcheck="false" inputmode="text">
        <button class="btn btn-find" id="find">查找</button>
      </div>
    </div>

    <p id="status">还没有照片。先上传一张摊开碎片的照片，建好索引后就能按编号查了。</p>

    <div id="photoSwitch"></div>

    <article class="piece-card" id="card">
      <p class="piece-code" id="cardCode">—</p>
      <p class="piece-where" id="cardWhere"></p>
      <img class="piece-thumb" id="cardThumb" alt="这块碎片的实拍裁剪图">
      <p class="piece-verify">对一眼图上的编号，确认系统没认错。</p>
    </article>

    <div class="rail-actions">
      <!-- 不要加 capture="environment"：那会让手机直接跳进相机，
           连相册都进不去，只能现拍。去掉之后手机会弹出「拍照 / 相册 /
           文件」三选一，两条路都留着。 -->
      <input type="file" id="file" accept="image/*" hidden>
      <button class="btn" id="upload">上传照片建索引</button>
    </div>

    <!-- 上传前先问「这张拍的是哪片区域」。这里选的名字就是 photo_id，
         选一个已有的名字即为重拍替换。名字没法从文件名里取：手机相册
         交给浏览器的文件名是点选那一刻现造的时间戳。 -->
    <div id="regionPicker">
      <p class="picker-title">这张拍的是哪片区域？</p>
      <div id="regionChoices"></div>
      <button class="btn btn-quiet" id="regionAdd" type="button">＋ 新的区域</button>
      <div class="picker-new" id="regionNew" hidden>
        <input id="regionName" type="text" placeholder="比如 1" autocomplete="off"
               maxlength="40">
        <button class="btn" id="regionGo" type="button">确定</button>
      </div>
      <button class="btn btn-quiet" id="regionCancel" type="button">取消</button>
    </div>

    <div>
      <div class="photos-head">
        <span class="field-label" style="margin:0">已建索引的照片</span>
      </div>
      <div id="photos"></div>
    </div>
  </aside>

  <main class="stage">
    <div id="viewport">
      <img id="view" alt="">
    </div>

    <div class="stage-empty" id="stageEmpty">
      <h2>取景器</h2>
      <p>查到碎片后，这里显示整张照片：目标保持原亮度，其余压暗，方便你把屏幕上的位置对到桌上。</p>
    </div>

    <div class="tools">
      <button class="btn btn-quiet" id="zoomOut" title="缩小">−</button>
      <button class="btn btn-quiet" id="fit">铺满</button>
      <button class="btn btn-quiet" id="zoomIn" title="放大">＋</button>
      <button class="btn btn-quiet" id="center">居中到碎片</button>
    </div>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
const statusEl = $("status"), viewEl = $("view"), viewport = $("viewport");
const card = $("card"), stageEmpty = $("stageEmpty");

let tx = 0, ty = 0, scale = 1;
let lastPiece = null;   // 最近一次命中的碎片，"居中到碎片" 用

function say(text, kind) {
  statusEl.textContent = text;
  statusEl.className = kind ? "is-" + kind : "";
}

/* ── 未识别照片切换器 ───────────────────────────────────────────
   未命中时每张有未识别碎片的照片给一个按钮。曾经这里只渲染第一张，
   其余照片仅在状态栏里被提一句名字——用户读得到"另一张还有 2 块"，
   却永远看不到那张图，也就没法去桌上核对。 */
const photoSwitch = $("photoSwitch");

function clearPhotoSwitch() {
  photoSwitch.replaceChildren();
  photoSwitch.classList.remove("is-shown");
}

function buildPhotoSwitch(code, entries) {
  photoSwitch.replaceChildren();
  entries.forEach(([photoId, ids], i) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "switch-btn";

    // photo_id 来自上传的文件名，是用户可控的字符串，只能用 textContent
    const name = document.createElement("span");
    name.className = "switch-name";
    name.textContent = photoId;
    const count = document.createElement("span");
    count.className = "switch-count";
    count.textContent = `${ids.length} 块未识别`;

    button.append(name, count);
    button.onclick = () => showUnrecognized(code, entries, i);
    photoSwitch.appendChild(button);
  });
  photoSwitch.classList.add("is-shown");
}

function showUnrecognized(code, entries, index) {
  const [photoId, ids] = entries[index];
  viewEl.src = `/api/highlight?code=${encodeURIComponent(code)}`
             + `&photo_id=${encodeURIComponent(photoId)}&t=${Date.now()}`;
  [...photoSwitch.children].forEach((button, i) =>
    button.classList.toggle("is-active", i === index));

  const total = entries.reduce((sum, [, ids]) => sum + ids.length, 0);
  say(`没认出 ${code}。当前显示照片 ${photoId} 的 ${ids.length} 块未识别碎片`
    + `（青色圈出），大概率就在其中。`
    + (entries.length > 1
        ? `另外 ${entries.length - 1} 张照片也有未识别碎片，共 ${total} 块，`
          + `点上面的按钮逐张看。`
        : ""), "miss");
}

function applyTransform() {
  viewEl.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
}

function fitToView() {
  if (!viewEl.naturalWidth) return;
  const sx = viewport.clientWidth / viewEl.naturalWidth;
  const sy = viewport.clientHeight / viewEl.naturalHeight;
  scale = Math.min(sx, sy);
  tx = (viewport.clientWidth - viewEl.naturalWidth * scale) / 2;
  ty = (viewport.clientHeight - viewEl.naturalHeight * scale) / 2;
  applyTransform();
}

function zoomAt(cx, cy, factor) {
  scale *= factor;
  tx = cx - (cx - tx) * factor;
  ty = cy - (cy - ty) * factor;
  applyTransform();
}

/* 把目标碎片挪到取景器正中。spec 5.7 明确否决了"查询后自动缩放"——
   会毁掉空间定位参照——所以这里只在用户主动点击时才动。 */
function centerOnPiece() {
  if (!lastPiece || !viewEl.naturalWidth) return;
  const [x, y, w, h] = lastPiece.bbox;
  scale = Math.min(6, Math.max(scale, viewport.clientHeight / (h * 5)));
  tx = viewport.clientWidth / 2 - (x + w / 2) * scale;
  ty = viewport.clientHeight / 2 - (y + h / 2) * scale;
  applyTransform();
}

/* 位置用大白话说出来。屏幕只是中介，真正的目标是让手伸到桌上对的地方，
   所以"右上区"这种说法比坐标有用。 */
function zoneOf(piece) {
  if (!viewEl.naturalWidth) return "";
  const [x, y, w, h] = piece.bbox;
  const cols = ["左", "中", "右"], rows = ["上", "中", "下"];
  const c = Math.min(2, Math.floor(((x + w / 2) / viewEl.naturalWidth) * 3));
  const r = Math.min(2, Math.floor(((y + h / 2) / viewEl.naturalHeight) * 3));
  return (c === 1 && r === 1) ? "正中" : cols[c] + rows[r] + "区";
}

/* ── 缩放平移：单指拖动，双指捏合，滚轮缩放 ───────────────── */
const pointers = new Map();
let lastMid = null, lastDist = 0;

viewport.addEventListener("pointerdown", (e) => {
  viewport.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  lastMid = null; lastDist = 0;
});

viewport.addEventListener("pointermove", (e) => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  const pts = [...pointers.values()];
  if (pts.length === 1) {
    tx += e.clientX - prev.x;
    ty += e.clientY - prev.y;
  } else {
    const [a, b] = pts;
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    if (lastDist > 0) zoomAt(mid.x, mid.y, dist / lastDist);
    if (lastMid) { tx += mid.x - lastMid.x; ty += mid.y - lastMid.y; }
    lastDist = dist; lastMid = mid;
  }
  applyTransform();
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) { lastDist = 0; lastMid = null; }
}
viewport.addEventListener("pointerup", endPointer);
viewport.addEventListener("pointercancel", endPointer);

viewport.addEventListener("wheel", (e) => {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 1 / 1.12);
}, { passive: false });

$("fit").onclick = fitToView;
$("zoomIn").onclick = () => zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, 1.25);
$("zoomOut").onclick = () => zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, 1 / 1.25);
$("center").onclick = centerOnPiece;

viewEl.onload = () => { stageEmpty.classList.add("is-gone"); fitToView(); };
addEventListener("resize", () => { if (viewEl.naturalWidth) fitToView(); });

/* ── 照片列表 ───────────────────────────────────────────────── */
async function refreshPhotos() {
  let data;
  try {
    data = await (await fetch("/api/photos")).json();
  } catch { return; }

  const box = $("photos");
  box.textContent = "";
  if (!data.photos.length) {
    const p = document.createElement("p");
    p.className = "rail-empty";
    p.textContent = "还没有照片。";
    box.append(p);
    return;
  }
  for (const photo of data.photos) {
    const row = document.createElement("div");
    row.className = "photo-row";

    const info = document.createElement("div");
    const id = document.createElement("div");
    id.className = "photo-id";
    id.textContent = photo.photo_id;
    const stat = document.createElement("div");
    stat.className = "photo-stat";
    stat.textContent = `已识别 ${photo.recognized}/${photo.total} · `
                     + photo.created_at.replace("T", " ");
    info.append(id, stat);

    const del = document.createElement("button");
    del.className = "btn btn-quiet";
    del.textContent = "删除";
    del.onclick = () => removePhoto(photo.photo_id);

    row.append(info, del);
    box.append(row);
  }
}

async function removePhoto(photoId) {
  await fetch(`/api/photos/${encodeURIComponent(photoId)}`, { method: "DELETE" });
  await refreshPhotos();
  // 切换按钮指向的照片可能刚被删掉，点下去只会 404
  clearPhotoSwitch();
  say(`已删除 ${photoId} 的索引。`);
}

/* ── 上传建索引 ─────────────────────────────────────────────────
   点「上传照片」不直接拉起文件选择器，先问一句「这张拍的是哪片区域」。
   这里选的名字就是 photo_id，也是查询结果里显示的那个名字。

   为什么名字只能在这里问：用户在手机上把照片改成 1/2/3/4，但那个名字
   从来没进过上传请求——安卓相册交给浏览器的是一个不带显示名的句柄，
   浏览器只好用点选那一刻的毫秒时间戳兜底。文件名里没有可抢救的东西。 */
const picker = $("regionPicker");
let pendingRegion = null;   // 已选定、等着文件选择器返回的区域名

function openPicker(names) {
  const choices = $("regionChoices");
  choices.replaceChildren();
  for (const name of names) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "switch-btn";

    // photo_id 是用户可控字符串，只能用 textContent
    const label = document.createElement("span");
    label.className = "switch-name";
    label.textContent = name;
    const hint = document.createElement("span");
    hint.className = "switch-count";
    hint.textContent = "重拍替换";

    button.append(label, hint);
    button.onclick = () => pickRegion(name);
    choices.appendChild(button);
  }

  // 库为空时没什么可选的，直接把输入框摆出来，省掉一次点击
  const empty = names.length === 0;
  $("regionAdd").hidden = empty;
  $("regionNew").hidden = !empty;
  $("regionName").value = "";
  picker.classList.add("is-shown");
  if (empty) $("regionName").focus();
}

function closePicker() {
  picker.classList.remove("is-shown");
}

function pickRegion(name) {
  pendingRegion = name;
  closePicker();
  $("file").click();
}

function confirmNewRegion() {
  const name = $("regionName").value.trim();
  if (!name) { $("regionName").focus(); return; }
  // 输入一个已存在的名字与点那个区域的按钮完全等价：都是替换。
  // 不报重名——重拍本来就是常态操作。
  pickRegion(name);
}

$("upload").onclick = async () => {
  let names = [];
  try {
    const data = await (await fetch("/api/photos")).json();
    names = data.photos.map((p) => p.photo_id);
  } catch { /* 列表拿不到就当空库处理，仍然可以新建一个区域 */ }
  openPicker(names);
};

$("regionAdd").onclick = () => {
  $("regionAdd").hidden = true;
  $("regionNew").hidden = false;
  $("regionName").focus();
};
$("regionGo").onclick = confirmNewRegion;
$("regionCancel").onclick = () => { pendingRegion = null; closePicker(); };
$("regionName").addEventListener("keydown", (e) => {
  if (e.key === "Enter") confirmNewRegion();
});

$("file").onchange = async (e) => {
  const file = e.target.files[0];
  const region = pendingRegion;
  pendingRegion = null;
  if (!file) return;   // 用户在系统选择器里点了取消

  say("正在建索引，别关页面。");
  $("upload").disabled = true;
  try {
    const form = new FormData();
    form.append("file", file);
    if (region) form.append("photo_id", region);
    const response = await fetch("/api/photos", { method: "POST", body: form });
    const body = await response.json();
    if (!response.ok) throw new Error(body.detail || response.status);
    say(`照片 ${body.photo_id} 已建索引：分割 ${body.total} 块，`
      + `读出编号 ${body.recognized} 块，未识别 ${body.unrecognized} 块。`, "hit");
    await refreshPhotos();
  } catch (error) {
    say(`建索引失败：${error.message}。换一张深色纯背景、碎片摊开不重叠的照片再试。`, "bad");
  } finally {
    $("upload").disabled = false;
    e.target.value = "";
  }
};

/* ── 查询 ───────────────────────────────────────────────────── */
async function find() {
  const code = $("code").value.trim().toUpperCase();
  if (!code) { $("code").focus(); return; }

  card.classList.remove("is-shown");
  lastPiece = null;
  say(`正在查找 ${code}…`);

  let result;
  try {
    result = await (await fetch(`/api/query?code=${encodeURIComponent(code)}`)).json();
  } catch (error) {
    say(`查询失败：${error.message}。确认服务还在运行。`, "bad");
    return;
  }

  const stamp = Date.now();
  clearPhotoSwitch();   // 上一次未命中留下的按钮不能跟着这次结果走

  if (result.found) {
    lastPiece = result.piece;
    viewEl.src = `/api/highlight?code=${encodeURIComponent(code)}&t=${stamp}`;
    $("cardThumb").src = `/api/thumbnail?code=${encodeURIComponent(code)}&t=${stamp}`;
    $("cardCode").textContent = result.code;

    viewEl.addEventListener("load", () => {
      $("cardWhere").textContent =
        `照片 ${result.photo_id} · ${zoneOf(result.piece)} · `
        + `置信度 ${result.piece.confidence.toFixed(2)}`;
    }, { once: true });

    card.classList.add("is-shown");
    say(`找到 ${result.code}，在照片 ${result.photo_id} 里，已用洋红圈出。`, "hit");
    return;
  }

  const entries = Object.entries(result.unrecognized || {});
  if (!entries.length) {
    say(`${code} 不在任何一张照片里，而且所有碎片都读出了编号——它确实没被拍进去。`, "miss");
    return;
  }

  buildPhotoSwitch(code, entries);
  showUnrecognized(code, entries, 0);
}

$("find").onclick = find;
$("code").addEventListener("keydown", (e) => { if (e.key === "Enter") find(); });

refreshPhotos();
</script>
</body>
